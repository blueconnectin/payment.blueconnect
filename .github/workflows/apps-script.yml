name: Deploy application

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Apps Script and the connected Cloudflare application
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - Index.html
      - Code.gs
      - Portal.gs
      - Portal.html
      - .github/scripts/apps-script-sync.mjs
      - .github/scripts/verify-deployment.mjs
      - .github/workflows/apps-script.yml
      - cloudflare/**
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - tests/cloudflare.test.mjs
      - tests/portal.test.cjs

permissions:
  contents: read

concurrency:
  group: blueconnect-apps-script
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.APPS_SCRIPT_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned clasp CLI
        run: npm install --prefix "$RUNNER_TEMP/clasp-cli" --no-audit --no-fund @google/clasp@3.4.1
      - name: Sync source and optionally update Web App
        env:
          CLASP_AUTH_JSON: ${{ secrets.CLASP_AUTH_JSON }}
          CLASP_BIN: ${{ runner.temp }}/clasp-cli/node_modules/.bin/clasp
          APPS_SCRIPT_ID: 1KnwZq7MWdh-HDyJYSixXWBJY7zScSbQU1Y33zg7I35aqaShYaK0W2tHq
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
          PUBLISH_WEB_APP: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && vars.APPS_SCRIPT_AUTO_PUBLISH == 'true') }}
        run: node .github/scripts/apps-script-sync.mjs

  cloudflare:
    name: Deploy payment.blueconnect.id
    needs: sync
    if: >-
      needs.sync.result == 'success' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && vars.APPS_SCRIPT_AUTO_PUBLISH == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DRIVE_BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
      ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
      PORTAL_ENABLED: ${{ vars.PORTAL_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check Cloudflare connection
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Add the CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Add the CLOUDFLARE_ACCOUNT_ID repository secret.'; exit 1; }
          if [ -n "$ADMIN_INITIAL_PASSWORD" ]; then test "${#ADMIN_INITIAL_PASSWORD}" -ge 6 || { echo 'ADMIN_INITIAL_PASSWORD must have at least 6 characters.'; exit 1; }; fi
          if [ "$PORTAL_ENABLED" = 'true' ]; then test "${#AUTH_SECRET}" -ge 32 || { echo 'Add repository secret AUTH_SECRET before enabling portal.'; exit 1; }; fi
          test "${#DRIVE_BRIDGE_SECRET}" -ge 32 || { echo 'Add repository secret BRIDGE_SECRET with the same value as Apps Script CLOUDFLARE_BRIDGE_SECRET (at least 32 characters).'; exit 1; }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test server bridge
        run: npm run test:bridge
      - name: Build current application
        run: npm run build
      - name: Deploy the same commit to Cloudflare
        run: npx wrangler deploy --var "PORTAL_ENABLED:$PORTAL_ENABLED"
      - name: Keep Drive bridge configured as a Worker secret
        run: printf '%s' "$DRIVE_BRIDGE_SECRET" | npx wrangler secret put BRIDGE_SECRET
      - name: Configure portal session secret
        if: env.PORTAL_ENABLED == 'true'
        run: printf '%s' "$AUTH_SECRET" | npx wrangler secret put AUTH_SECRET
      - name: Configure initial admin password
        if: env.ADMIN_INITIAL_PASSWORD != ''
        run: printf '%s' "$ADMIN_INITIAL_PASSWORD" | npx wrangler secret put ADMIN_INITIAL_PASSWORD
      - name: Configure OneSignal sending secret
        if: env.ONESIGNAL_REST_API_KEY != ''
        run: printf '%s' "$ONESIGNAL_REST_API_KEY" | npx wrangler secret put ONESIGNAL_REST_API_KEY
      - name: Verify domain version and Drive connection
        run: node .github/scripts/verify-deployment.mjs
      - name: Summarize release
        run: |
          echo '### Cloudflare deployment completed' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Check https://payment.blueconnect.id/version.json for the served commit.' >> "$GITHUB_STEP_SUMMARY"
